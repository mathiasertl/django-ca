SETTINGS_DIR_ONE: True

EXTEND_URL_PATTERNS:
  - route: /path1
    view:
      view: yourapp1.views.YourView

EXTEND_INSTALLED_APPS:
  - yourapp1

CA_PERMIT_NAMES:
  - type: DNS
    value: permit-01.example.com

CA_EXTEND_PERMIT_NAMES:
  - type: DNS
    value: permit-01.extend.example.com

CA_PROHIBIT_NAMES:
  - type: DNS
    value: prohibit-01.example.com

CA_EXTEND_PROHIBIT_NAMES:
  - type: DNS
    value: prohibit-01.extend.example.com

EXTEND_CELERY_BEAT_SCHEDULE:
  custom-task-one:
    schedule: 300
    task: myapp.tasks.custom_task_one
