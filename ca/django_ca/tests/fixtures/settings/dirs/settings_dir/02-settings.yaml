SETTINGS_DIR_TWO: True

EXTEND_URL_PATTERNS:
  - route: /path2
    view:
      view: yourapp2.views.YourView


EXTEND_INSTALLED_APPS:
  - yourapp2

CA_PERMIT_NAMES:
  - type: DNS
    value: permit-02.example.com

CA_EXTEND_PERMIT_NAMES:
  - type: DNS
    value: permit-02.extend.example.com

CA_PROHIBIT_NAMES:
  - type: DNS
    value: prohibit-02.example.com

CA_EXTEND_PROHIBIT_NAMES:
  - type: DNS
    value: prohibit-02.extend.example.com

EXTEND_CELERY_BEAT_SCHEDULE:
  custom-task-two:
    schedule: 300
    task: myapp.tasks.custom_task_two