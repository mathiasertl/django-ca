name: Docker
on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:

env:
  UV_PYTHON_PREFERENCE: only-system
  UV_NO_SYNC: 1
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  calc-version:
    name: Calculate version
    runs-on: ubuntu-latest
    outputs:
      django-ca-version: ${{ steps.django-ca-version.outputs.DJANGO_CA_VERSION }}
    steps:
      - name: Acquire sources
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
          architecture: x64

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --no-default-groups --group dist

      - name: Calculate version
        run: echo "DJANGO_CA_VERSION=$(uv run -q hatch -q version)" >> $GITHUB_ENV

      - name: Export version
        id: django-ca-version
        run: echo "DJANGO_CA_VERSION=$DJANGO_CA_VERSION" | tee -a $GITHUB_OUTPUT

  test:
    name: Test main image
    # Skip for Dependabot pull requests (github.head_ref is only set for pull_request events). The `build`
    # job still runs, see the condition there.
    if: ${{ !startsWith(github.head_ref, 'dependabot/') }}
    runs-on: ubuntu-latest
    needs:
      - calc-version
    env:
      DJANGO_CA_VERSION: ${{ needs.calc-version.outputs.django-ca-version }}
    strategy:
      matrix:
        python-version: [ "3.11", "3.12", "3.13", "3.14" ]
        debian-version: [ "trixie" ]
    permissions:
      contents: read
      actions: write

    steps:
      # buildx is required for docker build cache reuse
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0
        with:
          driver: docker-container
      - run: docker buildx ls
      - name: Acquire sources
        uses: actions/checkout@v7.0.1
      - name: Build test stage
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: false
          sbom: false
          tags: test.${{ matrix.python-version }}
          target: test
          cache-from: type=gha,scope=test-${{ matrix.python-version }}-${{ matrix.debian-version }}
          cache-to: type=gha,mode=max,scope=test-${{ matrix.python-version }}-${{ matrix.debian-version }}
          # NOTE: Use 0.0.0 as version to improve cache-reuse
          build-args: |
            IMAGE=python:${{ matrix.python-version }}-slim-${{ matrix.debian-version }}
            DJANGO_CA_VERSION=0.0.0+py${{ matrix.python-version }}
            COVERAGE_ARGS=--no-cov

  test-alpine:
    name: Test Alpine image
    # Skip for Dependabot pull requests. The `build-alpine` job still runs, see the condition there.
    if: ${{ !startsWith(github.head_ref, 'dependabot/') }}
    runs-on: ubuntu-latest
    needs:
      - calc-version
    env:
      DJANGO_CA_VERSION: ${{ needs.calc-version.outputs.django-ca-version }}
    strategy:
      matrix:
        alpine-version: [ "3.22", "3.23", "3.24" ]
        python-version: [ "3.11", "3.12", "3.13", "3.14" ]
    permissions:
      contents: read
      actions: write

    steps:
      # buildx is required for docker build cache reuse
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0
        with:
          driver: docker-container
      - run: docker buildx ls
      - name: Acquire sources
        uses: actions/checkout@v7.0.1
      - name: Build test stage
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: false
          sbom: false
          tags: test.${{ matrix.python-version }}
          target: test
          file: Dockerfile.alpine
          cache-from: type=gha,scope=test-alpine-${{ matrix.python-version }}-${{ matrix.alpine-version }}
          cache-to: type=gha,mode=max,scope=test-alpine-${{ matrix.python-version }}-${{ matrix.alpine-version }}
          # NOTE: Use 0.0.0 as version to improve cache-reuse
          build-args: |
            IMAGE=python:${{ matrix.python-version }}-alpine${{ matrix.alpine-version }}
            DJANGO_CA_VERSION=0.0.0+py${{ matrix.python-version }}
            COVERAGE_ARGS=--no-cov

  build:
    name: Build image
    # Also run when `test` was skipped (Dependabot pull requests), so that the image is still built. The
    # `!cancelled()` call is required: without a status check function, an implicit `success()` is added,
    # which is false when a job in `needs` was skipped.
    if: ${{ !cancelled() && needs.calc-version.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    needs:
      - calc-version
      - test
    env:
      BUILDKIT_PROGRESS: plain
      DJANGO_CA_VERSION: ${{ needs.calc-version.outputs.django-ca-version }}
      DOCKER_LATEST: ${{ startsWith(github.ref, 'refs/tags/') }}
      DOCKER_SUFFIX: ""
      DOCKERFILE: "Dockerfile"
    permissions: &build-permissions
      packages: write
      contents: read
      attestations: write
      id-token: write
    outputs: &build-outputs
      tags: ${{ steps.build-and-upload.outputs.tags }}
      digest: ${{ steps.build-and-upload.outputs.digest }}
    steps: &build-steps
      # buildx is required for docker build cache reuse
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Acquire sources
        uses: actions/checkout@v7.0.1

      - id: build-and-upload
        name: Build and upload Docker image
        uses: ./.github/actions/build-docker-image
        with:
          # Pushing the image if building on the main branch or for a tag
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ env.DJANGO_CA_VERSION }}
          # Build `latest` flavor when building a tag (== new release)
          latest: ${{ env.DOCKER_LATEST }}
          suffix: ${{ env.DOCKER_SUFFIX }}
          add-date-suffix: ${{ startsWith(github.ref, 'refs/tags/') }}
          dockerfile: ${{ env.DOCKERFILE }}

  upload:
    name: Upload image
    if: startsWith(github.ref, 'refs/tags/')  # only publish on tag pushes
    runs-on: ubuntu-latest
    needs:
      - build
    env:
      DOCKER_TAGS: ${{ needs.build.outputs.tags }}
    environment: &upload-environment
      name: Docker Hub
      url: https://hub.docker.com/r/mathiasertl/django-ca
    permissions: &upload-permissions
      attestations: write
      id-token: write
    steps: &upload-steps
      - uses: actions/checkout@v7.0.1
      - id: upload-to-dockerhub
        name: Upload image to Docker Hub
        uses: ./.github/actions/push-to-dockerhub
        with:
          docker-hub-username: ${{ secrets.DOCKER_HUB_USERNAME }}
          docker-hub-token: ${{ secrets.DOCKER_HUB_TOKEN }}
          tags: ${{ env.DOCKER_TAGS }}

  build-alpine:
    name: Build Alpine image
    # Also run when `test-alpine` was skipped, see the `build` job for details.
    if: ${{ !cancelled() && needs.calc-version.result == 'success' && (needs.test-alpine.result == 'success' || needs.test-alpine.result == 'skipped') }}
    runs-on: ubuntu-latest
    needs:
      - calc-version
      - test-alpine
    env:
      DJANGO_CA_VERSION: ${{ needs.calc-version.outputs.django-ca-version }}
      DOCKER_LATEST: "false"
      DOCKER_SUFFIX: "-alpine"
      DOCKERFILE: "Dockerfile.alpine"
    permissions: *build-permissions
    outputs: *build-outputs
    steps: *build-steps

  upload-alpine:
    name: Upload image (Alpine)
    if: startsWith(github.ref, 'refs/tags/')  # only publish on tag pushes
    runs-on: ubuntu-latest
    needs:
      - build-alpine
    env:
      DOCKER_TAGS: ${{ needs.build-alpine.outputs.tags }}
    environment: *upload-environment
    permissions: *upload-permissions
    steps: *upload-steps